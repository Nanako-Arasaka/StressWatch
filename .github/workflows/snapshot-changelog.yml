name: Snapshot changelog

# Refreshes stresswatch-web/public/changelog.json from the live
# GitHub master branch every 12 hours (and on manual dispatch).
# If the file changes, the change is committed back to master.
# Do NOT put [skip ci] in the commit message — that used to block
# Deploy StressWatch Web, so Pages never picked up the new snapshot.

on:
  schedule:
    # Every 12 hours at 00:00 and 12:00 UTC
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    # Allow a manual refresh via a one-liner label
    branches: [master]
    paths:
      - "stresswatch-web/scripts/snapshot-commits.mjs"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run snapshot script
        working-directory: stresswatch-web
        env:
          GITHUB_REPO: Nanako-Arasaka/StressWatch
        run: node scripts/snapshot-commits.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet stresswatch-web/public/changelog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        # The committer identity must match a GitHub-verified address
        # so the commit counts toward Nanako-Arasaka's contribution
        # graph and shows the user's avatar (not the anonymous
        # github-actions[bot] / stresswatch-bot identity, which used
        # to show up here and break the contribution streak).
        # 3143445389@qq.com is the address GitHub already links to
        # the user's commits (verified via gh api .../commits).
        run: |
          git config user.name "Nanako-Arasaka"
          git config user.email "3143445389@qq.com"
          git add stresswatch-web/public/changelog.json
          # No [skip ci]: this push must trigger Deploy StressWatch Web
          git commit -m "chore(changelog): refresh GitHub snapshot"
          git push origin HEAD:master