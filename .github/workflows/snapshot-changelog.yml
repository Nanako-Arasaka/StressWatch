name: Snapshot changelog

# Refreshes stresswatch-web/public/changelog.json from the live
# GitHub master branch every 6 hours (and on manual dispatch).
# If the file changes, the change is committed back to master,
# which triggers the Pages deploy workflow.

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    # Allow a manual refresh via a one-liner label
    branches: [master]
    paths:
      - "stresswatch-web/scripts/snapshot-commits.mjs"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run snapshot script
        working-directory: stresswatch-web
        env:
          GITHUB_REPO: Nanako-Arasaka/StressWatch
        run: node scripts/snapshot-commits.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet stresswatch-web/public/changelog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "stresswatch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stresswatch-web/public/changelog.json
          git commit -m "chore(changelog): refresh GitHub snapshot [skip ci]"
          git push origin HEAD:master